<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página de Afiliados</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Preload mantido com as variáveis do SaaS -->
<link rel="preload" as="image" href="{{DESKTOP_PRINT}}" media="(min-width: 769px)">
<link rel="preload" as="image" href="{{MOBILE_PRINT}}" media="(max-width: 768px)">

<style>
:root{
  --desktop-bg-image:url('{{DESKTOP_PRINT}}');
  --mobile-bg-image:url('{{MOBILE_PRINT}}');
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  width:100%;
  overflow:hidden;
  font-family:Poppins,sans-serif;
}

/* BACKGROUND */
.background-container{
  position:fixed;
  inset:0;
  background:#000;
  background-image:var(--desktop-bg-image);
  background-size:cover;
  background-position:center;
  filter:brightness(.8);
  z-index:-1;
}

@media(max-width:768px){
  .background-container{
    background-image:var(--mobile-bg-image);
  }
}

/* OVERLAY */
#cookie-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.4s ease;
  z-index:1000;
  padding: 20px;
}

#cookie-popup.show{
  opacity:1;
  pointer-events:auto;
}

/* POPUP - ESTILO COMPACTO */
.popup{
  background:#fff;
  border-radius:16px;
  max-width:420px;
  width:100%;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.3);
  transform:scale(.95);
  transition:.3s ease;
  position:relative;
  overflow: hidden;
}

#cookie-popup.show .popup{transform:scale(1)}

.popup::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed,#ec4899);
}

h2{
  font-size:20px;
  font-weight:700;
  color:#1f2937;
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:#6b7280;
  line-height:1.5;
  margin-bottom:20px;
}

.buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:16px;
}

.btn{
  padding:10px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  border:2px solid #e5e7eb;
  text-decoration:none;
  min-width:110px;
  transition:.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.btn-accept{
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;
  border-color:#10b981;
}

.btn-accept:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(16,185,129,.35);
}

.btn-close{
  background:#f8fafc;
  color:#374151;
}

.btn-close:hover{
  background:#e5e7eb;
}

.footer{
  border-top:1px solid #e5e7eb;
  padding-top:12px;
  font-size:11px;
  color:#9ca3af;
}

/* RESPONSIVIDADE MOBILE */
@media(max-width:480px){
  .popup{
    padding:20px 16px;
    margin: 0 10px;
    width: auto;
  }

  h2{
    font-size:18px;
    margin-bottom:8px;
  }

  p{
    font-size:13px;
    margin-bottom:16px;
  }

  .buttons{
    flex-direction:column;
    gap:8px;
  }

  .btn{
    width:100%;
    padding:10px 16px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="background-container"></div>

<div id="cookie-popup">
  <div class="popup">
    <h2>Política de cookies</h2>
    <p>
      Este sitio web utiliza cookies para personalizar el contenido y analizar el tráfico.
      Al hacer clic en “Permitir”, usted acepta nuestra política de cookies.
    </p>

    <div class="buttons">
      <button class="btn btn-accept" id="acceptBtn">Permitir</button>
      <button class="btn btn-close" id="closeBtn">Cerrar</button>
    </div>

    <div class="footer">Su privacidad es importante para nosotros</div>
  </div>
</div>

<script>
// Variável do SaaS mantida
const AFFILIATE_LINK = "{{AFFILIATE_LINK}}";
let redirected = false;

// Elementos do DOM
const popupEl = document.getElementById('cookie-popup');
const acceptBtn = document.getElementById('acceptBtn');
const closeBtn = document.getElementById('closeBtn');

// Função para resetar o estado
function resetState() {
    redirected = false;
    popupEl.classList.add('show');
}

// Redirecionamento instantâneo
function go() {
    if(redirected) return; 
    redirected = true;

    if(typeof window.runTrackerRedirect === "function"){
        window.runTrackerRedirect(AFFILIATE_LINK);
    }else{
        window.location.href = AFFILIATE_LINK;
    }
}

acceptBtn.onclick = go;
closeBtn.onclick = go;

// Inicializa ao carregar
window.addEventListener('load', resetState);

// Lógica do Botão Voltar (Back Button)
window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
        resetState();
    }
});
</script>

</body>
</html>
